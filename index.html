<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중화 반응 모형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&family=STIX+Two+Text:ital@1&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#5dc2b0; --mint-deep:#23907f; --mint-soft:#e3f5f1;
  --yellow:#f4c33b; --salmon:#e9966b; --num:#e8843a;
  --ink:#231f20; --muted:#646b6c; --line:#d9dddc;
  --paper:#fff; --panel:#f5f8f7; --stage:#fcfdfd;
  --gray-tag:#98a2a2; --red:#e2453c;
  --glass:#9fb3b8; --glass-fill:rgba(255,255,255,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mint:#5dc2b0; --mint-deep:#7fd8c8; --mint-soft:#1f3b37;
    --ink:#eef2f1; --muted:#a7b0b0; --line:#3a4443;
    --paper:#151a1a; --panel:#1d2424; --stage:#192020;
    --glass:#7d9196; --glass-fill:rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"]{
  --mint:#5dc2b0; --mint-deep:#7fd8c8; --mint-soft:#1f3b37;
  --ink:#eef2f1; --muted:#a7b0b0; --line:#3a4443;
  --paper:#151a1a; --panel:#1d2424; --stage:#192020;
  --glass:#7d9196; --glass-fill:rgba(255,255,255,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent}
.ch i{font-family:'STIX Two Text',serif;font-style:italic}

.app{display:grid;grid-template-rows:auto 1fr;height:100vh;padding:14px 18px 18px;gap:12px}
.top{display:flex;align-items:center;gap:14px}
.progress{flex:1;height:8px;background:var(--line);border-radius:99px;position:relative;overflow:visible}
.progress .fill{position:absolute;left:0;top:0;bottom:0;background:var(--mint);border-radius:99px;transition:width .5s}
.progress .dot{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--mint);border:3px solid var(--paper);box-shadow:0 0 0 2px var(--mint);transition:left .5s}

.main{display:grid;grid-template-columns:230px 1fr;gap:16px;min-height:0}
.side{display:flex;flex-direction:column;gap:18px;overflow:auto;padding-right:2px}
.side h2{font-size:15px;margin:0 0 10px;color:var(--mint-deep);display:flex;align-items:center;gap:6px}
.side h2::before{content:"";width:6px;height:16px;border-radius:3px;background:var(--mint)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.legend li{display:flex;align-items:center;gap:10px;font-size:14.5px}
.legend svg{flex:none}
.legend .nm{color:var(--muted);font-size:13px;margin-left:auto}
.terms{display:flex;flex-direction:column;gap:12px}
.term{background:var(--panel);border-radius:14px;padding:12px 14px}
.term b{display:block;font-size:15px;margin-bottom:4px}
.term p{margin:0;font-family:'Noto Serif KR',serif;font-weight:600;font-size:14px;line-height:1.6;color:var(--muted)}

.right{display:grid;grid-template-rows:1fr auto;gap:12px;min-height:0}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:0}
.stage svg{width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:99px;font-size:16px;font-weight:500;pointer-events:none;transition:.3s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:.92;transform:translate(-50%,0)}
.restart{position:absolute;left:14px;bottom:14px;min-height:48px;padding:0 20px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 15px 'Noto Sans KR',sans-serif;cursor:pointer}
.restart:hover{border-color:var(--mint)}

.panel{background:var(--panel);border-radius:20px;padding:14px 20px 16px}
.phead{display:flex;align-items:center;gap:12px}
.tag{background:var(--salmon);color:#fff;font-weight:700;font-size:14px;padding:4px 14px;border-radius:99px}
.count{color:var(--muted);font-size:14px}
.next{margin-left:auto;min-height:48px;padding:0 26px;border-radius:99px;border:none;background:var(--line);color:var(--muted);font:700 16px 'Noto Sans KR',sans-serif;cursor:pointer;transition:background .3s,color .3s}
.next.ready{background:var(--mint);color:#fff}
.next.blink{animation:blink .45s 2}
@keyframes blink{50%{transform:scale(1.07);box-shadow:0 0 0 6px var(--mint-soft)}}
.pbody{display:flex;align-items:baseline;gap:12px;margin-top:8px}
.num{font-family:'Noto Serif KR',serif;font-weight:600;font-size:28px;color:var(--num)}
.stext{margin:0;font-family:'Noto Serif KR',serif;font-weight:600;font-size:21px;line-height:1.5}
.hint{margin:4px 0 0 30px;color:var(--muted);font-size:14.5px}

/* SVG */
svg text{font-family:'Noto Sans KR',sans-serif}
.lbl{font-family:'Noto Sans KR',sans-serif;fill:var(--ink)}
.mut{fill:var(--muted)}
.ion text{font-family:'Noto Sans KR',sans-serif;font-weight:700;fill:#1d2626}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.hit{cursor:pointer}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.55}}
.vbtn rect{fill:var(--paper);stroke:var(--mint);stroke-width:2;transition:fill .2s}
.vbtn text{font-family:'Noto Sans KR',sans-serif;font-weight:700;fill:var(--ink)}
.vbtn.done rect{fill:var(--mint-soft)}
.vbtn.sel rect{fill:var(--mint)}
.vbtn.sel text{fill:#fff}
.mono{font-family:'Share Tech Mono',monospace}
.fade{transition:opacity .4s}
.defpop{position:absolute;left:50%;top:22px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;width:min(680px,88%);background:var(--paper);border:2px solid var(--mint);border-radius:20px;padding:16px 64px 18px 24px;box-shadow:0 10px 30px rgba(0,0,0,.12);transition:.35s}
.defpop.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.defpop b{display:inline-block;background:var(--mint);color:#fff;font-size:15px;padding:3px 14px;border-radius:99px;margin-bottom:8px}
.defpop p{margin:0;font-family:'Noto Serif KR',serif;font-weight:600;font-size:21px;line-height:1.55}
.defpop .x{position:absolute;right:8px;top:8px;width:48px;height:48px;border:none;background:none;color:var(--muted);font-size:26px;cursor:pointer;border-radius:50%}
.defpop .x:hover{background:var(--panel)}

@media (max-width:900px), (orientation:portrait){
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  .side{flex-direction:row;overflow:visible}
  .legend{flex-direction:row;flex-wrap:wrap;gap:8px 16px}
  .legend .nm{display:none}
  .terms-wrap{display:none}
  .stage{aspect-ratio:1000/600}
  .stext{font-size:18px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="progress"><div class="fill" id="pfill"></div><div class="dot" id="pdot"></div></div>
  </div>
  <div class="main">
    <aside class="side">
      <section>
        <h2>입자</h2>
        <ul class="legend" id="legend"></ul>
      </section>
      <section class="terms-wrap">
        <h2>용어</h2>
        <div class="terms">
          <div class="term"><b>중화 반응</b><p>산과 염기가 반응하여 물이 생성되는 반응</p></div>
          <div class="term"><b>중화열</b><p>중화 반응이 일어날 때 발생하는 열</p></div>
        </div>
      </section>
    </aside>
    <div class="right">
      <div class="stage">
        <svg id="svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-label="중화 반응 모형"></svg>
        <div class="defpop" id="defpop" role="dialog" aria-label="중화 반응">
          <button class="x" id="defx" aria-label="닫기">×</button>
          <b>중화 반응</b>
          <p>산의 수소 이온(H<sup>+</sup>)과 염기의 수산화 이온(OH<sup>−</sup>)이 반응하여 물(H<sub>2</sub>O)이 생성되는 반응</p>
        </div>
        <div class="toast" id="toast"></div>
        <button class="restart" id="restart">처음부터</button>
      </div>
      <div class="panel">
        <div class="phead">
          <span class="tag" id="tag">1단계</span>
          <span class="count" id="count">1 / 2</span>
          <button class="next" id="next">다음 단계</button>
        </div>
        <div class="pbody"><span class="num" id="num">1</span><p class="stext" id="stext"></p></div>
        <p class="hint" id="hint"></p>
      </div>
    </div>
  </div>
</div>

<script>
/* ───────── 교사용 설정값 ───────── */
const CFG = {
  // 학생 실측 온도(℃). 한 줄 = 한 명, 순서는 염산 2·4·6·8·10 mL (수산화 나트륨 10·8·6·4·2 mL)
  // 그래프에는 각 열의 평균(소수 첫째 자리)이 찍힌다. 빼고 싶은 줄은 지우면 된다.
  studentData: [
    [23.8, 26.4, 27.4, 25.9, 23.9],
    [24.2, 26.6, 28.1, 26.1, 23.8],
    [21.4, 27.5, 27.9, 25.9, 23.9],
    [24.8, 26.3, 28.5, 26.8, 24.3],
    [24.1, 26.0, 27.5, 25.7, 23.4],
    [23.7, 25.1, 26.2, 23.9, 22.9],
    [23.5, 25.2, 27.1, 25.2, 23.5],
    [23.4, 25.9, 28.1, 25.5, 23.5]
  ],
  startTemp: 21.5,      // 섞기 전 두 수용액의 온도(℃) — 온도계가 이 값에서 출발한다
  temps: null,          // 평균 대신 직접 쓸 값. 예: [23, 25.5, 28, 25.5, 23] (null이면 평균 사용)
  tempMin: 21,          // 그래프 세로축 최솟값(℃)
  tempMax: 29,          // 그래프 세로축 최댓값(℃)
  mixTime: 1100,        // 1단계: 두 수용액이 섞이는 시간(ms)
  reactTime: 700,       // 1단계: H⁺와 OH⁻가 만나 물이 되는 시간(ms)
  ionStart: 4,          // 3단계: 처음 묽은 염산 속 H⁺(=Cl⁻) 수
  ionAdds: 8,           // 3단계: 수산화 나트륨 수용액을 넣는 횟수 (한 번에 Na⁺·OH⁻ 1개씩)
  addTime: 800,         // 3단계: 한 번 넣을 때 입자가 떨어지는 시간(ms)
  pourTime: 1100,       // 2단계: 수산화 나트륨 수용액을 붓는 시간(ms)
  thermoTime: 900,      // 2단계: 온도계가 올라가는 시간(ms)
  labelMode: 'button',  // 액성(염기성·중성·산성) 표시: 'button' 버튼으로 / 'auto' 다섯 개 측정 후 자동 / 'none' 표시 안 함
  btb: { base: '#3f86d6', neutral: '#3fae5a', acid: '#f2cf3a' } // BTB 용액 색
};

/* ───────── 데이터 ───────── */
const COMBOS = [[2,10],[4,8],[6,6],[8,4],[10,2]];
const TEMPS = CFG.temps || COMBOS.map((_, i) => {
  const col = CFG.studentData.map(r => r[i]);
  return Math.round(col.reduce((a, b) => a + b, 0) / col.length * 10) / 10;
});
const liq = ([a, b]) => a < b ? 'base' : a === b ? 'neutral' : 'acid';

const STEPS = [
  { tag: '1단계', cls: '', text: '묽은 염산과 수산화 나트륨 수용액을 혼합한다.',
    hint: '화살표를 눌러 두 수용액을 혼합해 보자.',
    ok: '' }, // 1단계는 토스트 대신 중화 반응 팝업이 뜬다
  { tag: '2단계', cls: '', text: '농도와 온도가 같은 묽은 염산과 수산화 나트륨 수용액의 부피를 달리하여 혼합한다.',
    hint: '아래의 부피 조합을 누르면 묽은 염산에 수산화 나트륨 수용액을 넣는다.',
    ok: '다섯 가지 혼합 용액의 온도를 모두 측정했다.' },
  { tag: '3단계', cls: '', text: '묽은 염산(HCl)에 수산화 나트륨(NaOH) 수용액을 넣어 줄 때 각 이온 수의 변화를 관찰한다.',
    hint: '[넣기]를 눌러 수산화 나트륨 수용액을 조금씩 넣어 보자.',
    ok: '수산화 나트륨 수용액을 모두 넣었다.' }
];

/* ───────── 도구 ───────── */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, s, attrs = {}) {
  const t = el('text', Object.assign({ x, y, class: 'lbl' }, attrs), parent);
  t.textContent = s; return t;
}
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
let gen = 0; // 처음부터 누르면 진행 중 애니메이션 중단
function tween(dur, fn) {
  const my = gen;
  return new Promise(res => {
    if (reduce || dur <= 0) { fn(1); return res(); }
    const t0 = performance.now();
    (function f(now) {
      if (my !== gen) return;
      const t = Math.min(1, (now - t0) / dur);
      fn(ease(t));
      t < 1 ? requestAnimationFrame(f) : res();
    })(t0);
  });
}
const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
const lerp = (a, b, t) => a + (b - a) * t;

/* ───────── 입자 ───────── */
const ION = {
  H:   { r: 12, c1: '#ffffff', c2: '#c9d2d4', main: 'H',  sup: '+', nm: '수소 이온' },
  Cl:  { r: 22, c1: '#9ad889', c2: '#3f8f3a', main: 'Cl', sup: '−', nm: '염화 이온' },
  Na:  { r: 15, c1: '#fbe57a', c2: '#d9a514', main: 'Na', sup: '+', nm: '나트륨 이온' },
  OH:  { r: 20, c1: '#f0a6d8', c2: '#b6458f', main: 'OH', sup: '−', nm: '수산화 이온' },
  H2O: { r: 21, c1: '#9fd6f5', c2: '#2f86c9', main: 'H2O', nm: '물' }
};
const defs = el('defs', {}, svg);
for (const k in ION) {
  const g = el('radialGradient', { id: 'g-' + k, cx: '35%', cy: '30%', r: '75%' }, defs);
  el('stop', { offset: '0%', 'stop-color': ION[k].c1 }, g);
  el('stop', { offset: '100%', 'stop-color': ION[k].c2 }, g);
}
function ionLabel(t, k, fs) {
  const d = ION[k];
  if (k === 'H2O') {
    const a = el('tspan', {}, t); a.textContent = 'H';
    const b = el('tspan', { dy: fs * .3, 'font-size': fs * .68 }, t); b.textContent = '2';
    const c = el('tspan', { dy: -fs * .3 }, t); c.textContent = 'O';
  } else {
    const a = el('tspan', {}, t); a.textContent = d.main;
    const b = el('tspan', { dy: -fs * .45, 'font-size': fs * .7 }, t); b.textContent = d.sup;
  }
}
function makeIon(parent, k, x, y, pop, sc = 1) {
  const d = ION[k];
  const outer = el('g', { transform: `translate(${x},${y})`, class: 'ion' }, parent);
  const mid = sc !== 1 ? el('g', { transform: `scale(${sc})` }, outer) : outer;
  const inner = el('g', pop ? { class: 'pop' } : {}, mid);
  if (pop && typeof pop === 'number') inner.style.animationDelay = pop + 'ms';
  if (k === 'H2O') el('ellipse', { rx: d.r + 5, ry: d.r - 3, fill: `url(#g-${k})`, stroke: 'rgba(0,0,0,.18)' }, inner);
  else el('circle', { r: d.r, fill: `url(#g-${k})`, stroke: 'rgba(0,0,0,.18)' }, inner);
  const fs = k === 'H' ? 11 : k === 'Na' ? 12 : 13;
  const t = el('text', { 'text-anchor': 'middle', y: fs * .38, 'font-size': fs }, inner);
  ionLabel(t, k, fs);
  return { g: outer, k, x, y, move(nx, ny) { this.x = nx; this.y = ny; outer.setAttribute('transform', `translate(${nx},${ny})`); } };
}
// 사이드 범례
const legend = document.getElementById('legend');
for (const k of ['H', 'Cl', 'Na', 'OH', 'H2O']) {
  const li = document.createElement('li');
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('width', 52); s.setAttribute('height', 46); s.setAttribute('viewBox', '-26 -23 52 46');
  makeIon(s, k, 0, 0);
  li.appendChild(s);
  const name = document.createElement('span');
  name.innerHTML = k === 'H2O' ? 'H<sub>2</sub>O' : ION[k].main + '<sup>' + ION[k].sup + '</sup>';
  li.appendChild(name);
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = ION[k].nm;
  li.appendChild(nm);
  legend.appendChild(li);
}
// SVG의 defs 그라디언트는 범례 svg에서도 같은 문서라 참조됨

/* 실험대 위 그림 제목 (농도 조건 명시) */
function caption(parent, x, y, str) {
  return txt(parent, x, y, str, { 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: 'var(--mint-deep)', class: '' });
}

/* ───────── 비커 ───────── */
let clipN = 0;
function beaker(parent, cx, bottom, w, h, liquidColor) {
  const x0 = cx - w / 2, x1 = cx + w / 2, top = bottom - h;
  const g = el('g', {}, parent);
  el('ellipse', { cx, cy: bottom + 8, rx: w / 2 + 18, ry: 9, fill: 'rgba(0,0,0,.07)' }, g);
  const inner = `M${x0} ${top + 6} L${x0} ${bottom - 16} Q${x0} ${bottom} ${x0 + 16} ${bottom} L${x1 - 16} ${bottom} Q${x1} ${bottom} ${x1} ${bottom - 16} L${x1} ${top + 6} Z`;
  el('path', { d: inner, fill: 'var(--glass-fill)' }, g);
  const id = 'clip' + (++clipN);
  const cp = el('clipPath', { id }, defs); el('path', { d: inner }, cp);
  const liquid = el('rect', { x: x0, width: w, y: bottom, height: 0, fill: liquidColor, 'clip-path': `url(#${id})`, class: 'liquid' }, g);
  const surf = el('line', { x1: x0 + 2, x2: x1 - 2, y1: bottom, y2: bottom, stroke: 'rgba(255,255,255,.7)', 'stroke-width': 2, opacity: 0 }, g);
  const layer = el('g', {}, g);
  // 유리
  el('path', { d: `M${x0 - 10} ${top} Q${x0} ${top} ${x0} ${top + 10} L${x0} ${bottom - 16} Q${x0} ${bottom} ${x0 + 16} ${bottom} L${x1 - 16} ${bottom} Q${x1} ${bottom} ${x1} ${bottom - 16} L${x1} ${top + 6} L${x1 + 4} ${top}`,
    fill: 'none', stroke: 'var(--glass)', 'stroke-width': 3, 'stroke-linejoin': 'round' }, g);
  for (let i = 1; i <= 4; i++) el('line', { x1: x0 + 8, x2: x0 + (i % 2 ? 20 : 28), y1: bottom - i * h / 5, y2: bottom - i * h / 5, stroke: 'var(--glass)', 'stroke-width': 1.5 }, g);
  el('rect', { x: x1 - 16, y: top + 18, width: 6, height: h * .55, rx: 3, fill: 'rgba(255,255,255,.55)' }, g);
  return {
    g, layer, liquid,

async function mix() {

  });

  if (my !== gen) return;

  const pairs = [[react[0], react[2]], [react[1], react[3]]];
  await tween(250, t => react.forEach(p => p.g.setAttribute('opacity', 1 - t)));

}

async function measure(i) {

  const my = ++gen;
  S2.cur = i;
  S2.btns.forEach((b, j) => { b.classList.toggle('sel', j === i); b.classList.toggle('done', S2.meas.has(j) && j !== i); });

  S2.comp2.textContent = '';
  const y0 = THY(CFG.startTemp);

  S2.pliq.setAttribute('y', 0); S2.pliq.setAttribute('height', 38);
  S2.pour.setAttribute('opacity', 1);
  await wait(450);
  if (my !== gen) return;
  S2.comp2.textContent = `+ 수산화 나트륨 수용액 ${bb} mL`;
  const drops = [];
  for (let k = 0; k < nOH; k++) {
    const s1 = SLOTS[n++], s2 = SLOTS[n++];

    const oh = makeIon(S2.parts, 'OH', SPOUT[0], SPOUT[1], false, SC2); oh.to = so; ohs.push(oh); drops.push(oh);
    const na = makeIon(S2.parts, 'Na', SPOUT[0], SPOUT[1], false, SC2); na.to = sn; drops.push(na);
  }

    S2.b.level(lerp(L0, 190, t));
    S2.pliq.setAttribute('y', 38 * t); S2.pliq.setAttribute('height', 38 * (1 - t));
    drops.forEach((d, k) => {
      const u = Math.max(0, Math.min(1, (t - k * step) / span));

const UNIT3 = 250 / (CFG.ionStart + CFG.ionAdds); // 1번 넣는 양에 해당하는 용액 높이
let S3;
function buildStep3() {
  g3.innerHTML = '';
  const b = beaker(g3, B3.cx, B3.bottom, B3.w, B3.h, 'rgba(160,205,225,.55)');
  b.level(UNIT3 * CFG.ionStart);
  // 붓는 비커
  const pour = el('g', { opacity: 0, class: 'fade' }, g3);
  const pg = el('g', { transform: 'translate(150 66) rotate(58)' }, pour);
  el('path', { d: 'M-26 -32 L-26 26 Q-26 34 -18 34 L18 34 Q26 34 26 26 L26 -32', fill: 'var(--glass-fill)', stroke: 'var(--glass)', 'stroke-width': 3 }, pg);
  el('rect', { x: -24, y: 6, width: 48, height: 26, rx: 6, fill: 'rgba(160,205,225,.6)' }, pg);
  txt(g3, B3.cx, 470, '묽은 염산 + 수산화 나트륨 수용액', { 'text-anchor': 'middle', 'font-size': 15 });
  // 이온 수 칩
  const chips = {};
  ['H', 'Cl', 'Na', 'OH'].forEach((k, i) => {
    const x = 70 + i * 74;
    el('rect', { x: x - 32, y: 490, width: 66, height: 46, rx: 23, fill: 'var(--panel)', stroke: ICOL[k], 'stroke-width': 2 }, g3);
    const m = makeIon(g3, k, x - 12, 513); m.g.setAttribute('transform', `translate(${x - 12},513) scale(.75)`);
    chips[k] = txt(g3, x + 22, 520, '0', { 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, class: 'mono', fill: ICOL[k] });
  });
  // 그래프 틀
  const ax = el('g', {}, g3);
  for (let k = 0; k <= CFG.ionAdds; k++) el('line', { x1: IX(k), x2: IX(k), y1: 90, y2: 400, stroke: 'var(--line)', 'stroke-dasharray': '3 5' }, ax);
  el('line', { x1: 500, x2: 500, y1: 70, y2: 400, stroke: 'var(--ink)', 'stroke-width': 1.8 }, ax);
  el('line', { x1: 500, x2: 950, y1: 400, y2: 400, stroke: 'var(--ink)', 'stroke-width': 1.8 }, ax);
  el('path', { d: 'M494 78 l6 -10 l6 10 M942 394 l10 6 l-10 6', fill: 'var(--ink)', stroke: 'var(--ink)' }, ax);
  txt(ax, 0, 0, '이온 수', { 'font-size': 16, 'text-anchor': 'middle', transform: 'translate(470 235) rotate(-90)' });
  caption(ax, 725, 40, '농도가 같은 묽은 염산에 수산화 나트륨 수용액을 넣을 때 이온 수 변화');
  txt(ax, 490, 422, 'O', { 'text-anchor': 'end', 'font-size': 16 });
  txt(ax, 950, 430, '넣어 준 NaOH 수용액의 부피', { 'text-anchor': 'end', 'font-size': 16 });
  const plot = el('g', {}, g3);
  // 버튼
  const mk = (x, w, label, fn) => {
    const g = el('g', { class: 'vbtn hit', role: 'button' }, g3);
    el('rect', { x, y: 470, width: w, height: 54, rx: 27 }, g);
    const t = txt(g, x + w / 2, 503, label, { 'text-anchor': 'middle', 'font-size': 18, class: '' });
    g.addEventListener('click', fn);
    return { g, t };
  };
  const addBtn = mk(600, 150, '넣기', () => addOnce());
  const allBtn = mk(766, 150, '끝까지', () => addAll());
  S3 = { b, pour, chips, plot, addBtn, allBtn, parts: el('g', {}, b.layer), k: 0, busy: false,
         ions: [], hist: [] };
  // 처음 염산: H⁺, Cl⁻
  for (let i = 0; i < CFG.ionStart; i++) {
    const s1 = SLOT3[i * 2], s2 = SLOT3[i * 2 + 1];
    const [sh, sc] = i % 2 ? [s2, s1] : [s1, s2];
    S3.ions.push(Object.assign(makeIon(S3.parts, 'H', sh[0], sh[1], false, SC3), { slot: sh }));
    S3.ions.push(Object.assign(makeIon(S3.parts, 'Cl', sc[0], sc[1], false, SC3), { slot: sc }));
  }
  S3.used = CFG.ionStart * 2;
  record3(); drawIonPlot();
}
const count3 = k => S3.ions.filter(p => p.k === k).length;
function record3() {
  const c = { H: count3('H'), Cl: count3('Cl'), Na: count3('Na'), OH: count3('OH') };
  S3.hist[S3.k] = c;
  for (const k in c) S3.chips[k].textContent = c[k];
}
function drawIonPlot() {
  const p = S3.plot; p.innerHTML = '';
  const h = S3.hist;
  for (const k of ['Cl', 'Na', 'H', 'OH']) {
    const pts = h.map((c, i) => `${IX(i)},${IY(c[k])}`).join(' ');
    if (h.length > 1) el('polyline', { points: pts, fill: 'none', stroke: ICOL[k], 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, p);
    else el('circle', { cx: IX(0), cy: IY(h[0][k]), r: 4, fill: ICOL[k] }, p);
  }
  // 선 이름 (현재 끝점 옆)
  const last = h.length - 1, c = h[last];
  const lab = { H: 'H⁺', Cl: 'Cl⁻', Na: 'Na⁺', OH: 'OH⁻' };
  const placed = [];
  for (const k of ['Cl', 'Na', 'H', 'OH']) {
    let y = IY(c[k]) - 12;
    if (c[k] === 0) { if (k === 'H' && c.OH === 0) continue; y = 388; } // 0인 선은 축 위
    while (placed.some(v => Math.abs(v - y) < 18)) y -= 18;
    placed.push(y);
    txt(p, Math.min(IX(last) + 10, 958), y, lab[k], { 'font-size': 17, 'font-weight': 700, fill: ICOL[k], class: '' });
  }
  // 완전히 중화됨
  const eq = CFG.ionStart;
  if (last >= eq) {
    const x = IX(eq);
    // 원본처럼 OH⁻ 선 아래, 가로축 위 빈 곳에 둔다
    el('line', { x1: x, y1: 400, x2: x + 92, y2: 376, stroke: 'var(--muted)', 'stroke-width': 1.2 }, p);
    el('rect', { x: x + 92, y: 350, width: 88, height: 46, rx: 10, fill: '#f7c7bd', class: last === eq ? 'pop' : '' }, p);
    txt(p, x + 136, 369, '완전히', { 'text-anchor': 'middle', 'font-size': 14, fill: '#3b2a26', class: '' });
    txt(p, x + 136, 387, '중화됨.', { 'text-anchor': 'middle', 'font-size': 14, fill: '#3b2a26', class: '' });
  }
}
async function addOnce() {
  if (S.step !== 2 || S3.busy || S3.k >= CFG.ionAdds) return false;
  S3.busy = true;
  const my = gen;
  S3.pour.setAttribute('opacity', 1);
  const spout = [176, 52];
  const na = makeIon(S3.parts, 'Na', spout[0], spout[1], false, SC3); na.slot = SLOT3[S3.used++];
  const oh = makeIon(S3.parts, 'OH', spout[0], spout[1], false, SC3);
  const hs = S3.ions.filter(p => p.k === 'H').sort((a, b) => a.y - b.y);
  const target = hs[0]; // 가장 위의 H⁺와 반응
  oh.slot = target ? [target.x + 24, target.y] : SLOT3[S3.used++];
  const l0 = UNIT3 * (CFG.ionStart + S3.k);
  await tween(CFG.addTime, t => {
    S3.b.level(l0 + UNIT3 * t);
    na.move(lerp(spout[0], na.slot[0], t), lerp(spout[1], na.slot[1], t * t));
    const u = Math.max(0, t - .12) / .88;
    oh.move(lerp(spout[0], oh.slot[0], u), lerp(spout[1], oh.slot[1], u * u));
  });
  if (my !== gen) return false;
  S3.ions.push(na);
  if (target) {
    await tween(CFG.reactTime * .6, t => { oh.move(lerp(target.x + 24, target.x + 10, t), target.y); target.move(lerp(target.slot[0], target.slot[0] - 10, t), target.y); });
    if (my !== gen) return false;
    await tween(200, t => { oh.g.setAttribute('opacity', 1 - t); target.g.setAttribute('opacity', 1 - t); });
    if (my !== gen) return false;
    oh.g.remove(); target.g.remove();
    S3.ions.splice(S3.ions.indexOf(target), 1);
    S3.ions.push(Object.assign(makeIon(S3.parts, 'H2O', target.slot[0], target.slot[1], true, SC3), { slot: target.slot }));
  } else {
    S3.ions.push(Object.assign(oh, { slot: oh.slot }));
  }
  S3.k++;
  record3(); drawIonPlot();
  if (S3.k >= CFG.ionAdds) {
    S3.pour.setAttribute('opacity', 0);
    S3.addBtn.g.setAttribute('opacity', .4); S3.allBtn.g.setAttribute('opacity', .4);
    complete();
  }
  S3.busy = false;
  return true;
}
async function addAll() {
  if (S3.auto) return;
  S3.auto = true;
  const my = gen;
  while (S3.k < CFG.ionAdds && my === gen) {
    if (S3.busy) { await wait(100); continue; }
    await addOnce();
    await wait(150);
  }
  S3.auto = false;
}

/* ───────── 단계 전환 ───────── */
function goStep(n) {
  gen++;
  showDef(false);
  S.step = n;
  const groups = [g1, g2, g3], builds = [buildStep1, buildStep2, buildStep3];
  groups.forEach((g, i) => { if (i !== n) { g.setAttribute('opacity', 0); g.setAttribute('display', 'none'); } });
  builds[n]();
  groups[n].setAttribute('display', '');
  requestAnimationFrame(() => groups[n].setAttribute('opacity', 1));
  nextBtn.classList.remove('blink');
  renderPanel();
}
function resetAll() {
  S.done = STEPS.map(() => false);
  toastEl.classList.remove('show');
  goStep(0);
}

/* ───────── 교사용 단축키 ─────────
   스페이스·Enter·→ : 지금 할 동작(혼합 → 다음 단계 → 다음 부피 조합 → 액성 표시 → 다음 단계 → 넣기)
   1~5 : 2단계 부피 조합 바로 선택,  R : 처음부터 */
addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k === 'Enter' || k === 'ArrowRight') {
    e.preventDefault();
    if (S.step === 0) { if (!S1.mixed) mix(); else if (!S1.anim) goStep(1); }
    else if (S.step === 1) {
      const nx = COMBOS.findIndex((_, i) => !S2.meas.has(i));
      if (nx >= 0) measure(nx);
      else if (!S2.labels && CFG.labelMode === 'button') showLabels();
      else goStep(2);
    } else addOnce();
  } else if (/^[1-5]$/.test(k) && S.step === 1) measure(+k - 1);
  else if (k === 'r' || k === 'R') resetAll();
});

goStep(0);
</script>
